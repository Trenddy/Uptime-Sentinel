name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Smoke-test the CLI (demo + status + report)
        run: |
          python -m uptime_sentinel.cli demo --db data/ci-demo.db
          python -m uptime_sentinel.cli status --config config.example.yaml --db data/ci-demo.db
          python -m uptime_sentinel.cli report --db data/ci-demo.db --out docs/ci-report.html
